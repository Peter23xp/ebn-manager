<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1628" />

    <!-- SEO — ne pas éditer ici les balises de page.
         Les pages publiques (/, /legal/*, 404) sont pré-rendues au build par
         scripts/prerender.mjs : leurs balises <title>, description, canonical,
         Open Graph et JSON-LD (composant PageSEO) remplacent le bloc ci-dessous.
         Le bloc sert de valeur par défaut aux écrans de l'application (connexion,
         tableau de bord…), qui ne sont pas indexés. data-rh="true" permet à
         react-helmet-async de remplacer ces balises au lieu de les dupliquer. -->
    <!--seo-->
    <title>EBN Network — Entreprise Bénie Network</title>
    <meta name="description" content="Entreprise Bénie Network (EBN) : réseau de marketing relationnel avec boutiques à Goma, Bukavu et Kinshasa (RDC)." data-rh="true" />
    <meta name="robots" content="noindex, nofollow" data-rh="true" />
    <!--/seo-->

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Polices auto-hébergées (public/fonts) : aucun appel à Google Fonts,
         donc aucune adresse IP de visiteur transmise à un tiers (protection des données personnelles). -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
